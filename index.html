<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Carnet de tontine</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%AA%99%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
html{scroll-padding-top:env(safe-area-inset-top,0px)}
:root{--bg:#ececec;--card:#fff;--tint:#f4f4f5;--ink:#111113;--mute:#8b8b92;--line:#e7e7ea;--hd:#1b1b1d;--ind:#111113;--indtxt:#fff;--gold:#f2b632;--goldtxt:#111113;--ok:#1fa64a;--okbg:#e3f5e9;--late:#d9402f;--latebg:#fde8e5;--sunbg:#fff0c4;--green:#1fa64a;--orange:#f08c2b;--blue:#3b5bdb;--shadow:0 1px 2px rgba(0,0,0,.04),0 6px 18px rgba(0,0,0,.06);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e0e10;--card:#1a1a1d;--tint:#232327;--ink:#f2f2f3;--mute:#9b9ba3;--line:#2c2c31;--hd:#000;--ind:#f2f2f3;--indtxt:#111113;--ok:#5fd38b;--okbg:#14301f;--late:#ff9d8c;--latebg:#3d1f1b;--sunbg:#4a3c12;--shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35);color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 "Inter",system-ui,-apple-system,"Segoe UI",sans-serif}
header{display:flex;align-items:center;gap:12px;padding:18px clamp(16px,4vw,40px) 6px;max-width:1040px;margin:0 auto}
header h1{margin:0;flex:1;font-size:1.45rem;font-weight:700;letter-spacing:-.02em}
.ib{display:grid;place-items:center;width:40px;height:40px;border-radius:50%;background:var(--card);border:0;color:var(--ink);box-shadow:var(--shadow);text-decoration:none;cursor:pointer;font-size:1.4rem;line-height:1}
.ib svg,nav svg,.hact svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
[hidden]{display:none!important}
h2{margin:0 0 6px;font-size:1.25rem;font-weight:800;letter-spacing:-.015em}
h3{margin:0 0 8px;font-size:1rem;font-weight:600}
nav{display:flex;gap:4px;padding:4px;border-radius:999px;background:#111113}
nav button{border:0;border-radius:999px;background:none;color:#fff;padding:9px 18px;font:600 .92rem inherit;font-family:inherit;cursor:pointer}
nav button svg{display:none}
nav button[aria-pressed=true]{background:#fff;color:#111113}
main{max-width:1040px;margin:0 auto;padding:28px clamp(16px,4vw,40px) 72px;display:grid;gap:20px}
.panel{background:var(--card);border-radius:18px;padding:22px;box-shadow:var(--shadow)}
.sub{color:var(--mute);margin:0 0 16px;font-size:.93rem}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.stat{padding:14px 16px;border-radius:14px;background:var(--tint)}
.stat b{display:block;font-size:1.4rem;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;color:var(--ind)}
.stat span{color:var(--mute);font-size:.85rem}
.cal{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.cal{--num:#000;--line:#d9ddea;--ok:#1f7a55;--okbg:#dff3ea;--late:#b3402f;--latebg:#fbe3de;--ind:#243079;--sun:#e8b230;--sunbg:#fdf0cc}
@media (prefers-color-scheme:dark){.cal{--num:#f2f2f3;--line:#2f3466;--ok:#6fd6a6;--okbg:#17382d;--late:#ff9d8a;--latebg:#40201c;--ind:#8d9bff;--sun:#f1c24f;--sunbg:#3d3213}}
.day{border:1.5px solid var(--line);border-radius:8px;padding:6px 8px;min-height:72px;font-size:.8rem;display:flex;flex-direction:column;justify-content:space-between}
.day strong{font-size:1.05rem;color:var(--num)}
.day small{color:var(--mute)}
.day .g{font-weight:800;font-size:1rem}
.paid{background:var(--okbg);border-color:var(--ok)}.paid .g{color:var(--ok)}
.late{background:var(--latebg);border-color:var(--late)}.late .g{color:var(--late)}
.due{border-color:var(--ind);border-width:3px}
.susp{opacity:.55;border-style:dashed}
.d31{background:var(--sunbg);border-color:var(--sun)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin:0;font-size:.82rem;color:var(--mute)}
.cards{display:grid;gap:8px}
.row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px;padding:12px 14px;border-radius:14px;background:var(--tint)}
.step{display:flex;align-items:center;gap:8px}
.btn,.step button{font:600 .92rem inherit;font-family:inherit;border-radius:12px;border:2px solid var(--ind);background:transparent;color:var(--ind);padding:9px 18px;cursor:pointer}
.btn:hover{background:color-mix(in srgb,var(--ind) 10%,transparent)}
.btn.main{background:var(--ind);color:var(--indtxt)}
.btn.main:hover{background:var(--ind);filter:brightness(1.15)}
.btn.warn{border-color:var(--late);color:var(--late)}
.btn:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
form{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));align-items:end}
label{display:grid;gap:5px;font-size:.85rem;font-weight:600;color:var(--mute)}
input,select{font:inherit;font-weight:400;padding:10px 12px;border:2px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);min-width:0}
.msg{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:12px 16px;border-radius:14px;background:var(--latebg);color:var(--late);font-weight:600;margin-bottom:12px}
.msg .x{flex:0 0 auto;border:0;background:none;color:inherit;font-size:1.4rem;line-height:1;min-width:32px;min-height:32px;cursor:pointer}
.ferr{color:var(--late);font-weight:600;font-size:.82rem}
input[aria-invalid=true],select[aria-invalid=true]{border-color:var(--late)}
.cf{display:grid;gap:6px}
.ok{background:var(--okbg);color:var(--ok)}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:600;color:var(--mute);font-size:.82rem}
tbody tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.wrap{overflow-x:auto}
.empty{color:var(--mute);padding:8px 0;margin:0}
.sticky{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;display:grid;gap:8px}
.sticky .msg{margin:0;box-shadow:var(--shadow)}
.bar{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;align-items:end;background:var(--hd);color:#fff;border-radius:18px;padding:12px;box-shadow:0 10px 28px rgba(10,15,60,.35)}
.bar label{color:rgba(255,255,255,.8);font-size:.75rem}
.bar select{padding:8px 10px;width:100%;background:#fff;color:#141a3d;border-color:transparent}
.bar .stat{padding:7px 12px;background:rgba(255,255,255,.12)}
.bar .stat b{font-size:1.05rem;color:#fff}
.bar .stat span{color:rgba(255,255,255,.75);font-size:.75rem}
.csel{display:none}
.pfa{display:none}
.fld{display:grid;gap:6px;grid-column:1/-1}
.fld>span{font-size:.85rem;font-weight:600;color:var(--mute)}
.cpick{display:flex;flex-wrap:wrap;gap:8px}
.kpis{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));margin-top:14px}
.kpi{display:block;text-decoration:none;color:inherit;background:var(--tint);border-radius:14px;padding:14px 16px}
a.kpi:hover{outline:2px solid var(--line)}
.kpi span{display:block;font-size:.82rem;font-weight:600;color:var(--mute)}
.kpi b{display:block;font-size:1.5rem;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;color:var(--ind);line-height:1.2}
.kpi small{display:block;color:var(--mute);font-size:.8rem}
.kpi.main{grid-column:1/-1;background:var(--hd)}
.kpi.main span,.kpi.main small{color:rgba(255,255,255,.8)}
.kpi.main b{color:#fff;font-size:2rem}
.prog{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin:8px 0 4px}
.prog i{display:block;height:100%;border-radius:99px;background:var(--ind)}
.kpi.main .prog{background:rgba(255,255,255,.22)}
.kpi.main .prog i{background:var(--gold)}
section[id]{scroll-margin-top:16px}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.hero{background:linear-gradient(160deg,#2c2c2f,#131315);color:#fff;border-radius:24px;padding:18px 16px 16px;text-align:center;box-shadow:0 14px 34px rgba(0,0,0,.28)}
.pill{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.1);border-radius:99px;padding:6px 14px;font-size:.85rem;font-weight:600}
.pill i{width:18px;height:12px;border-radius:3px;background:var(--green)}
.hero small{display:block;color:rgba(255,255,255,.55);margin-top:14px;font-size:.85rem}
.hero .big{display:block;font-size:2.1rem;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin:2px 0 4px}
.hero .sm{color:rgba(255,255,255,.6);font-size:.85rem}
.acts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px}
.hact{display:grid;justify-items:center;gap:6px;color:rgba(255,255,255,.7);font:500 .78rem inherit;font-family:inherit;text-decoration:none;background:none;border:0;cursor:pointer}
.hact .c{display:grid;place-items:center;width:52px;height:52px;border-radius:50%;background:#e9e9ea;color:#111}
.sech{display:flex;justify-content:space-between;align-items:baseline;margin-top:4px}
.sech h2{margin:0;font-size:1.05rem}
.sech a{color:var(--ink);font-size:.85rem;font-weight:600;text-decoration:none}
.glist{display:grid;gap:12px}
.gcard{display:block;width:100%;text-align:left;font:inherit;color:inherit;border:0;cursor:pointer;background:var(--tint);border-radius:22px;padding:12px;box-shadow:var(--shadow)}
.gh{display:flex;align-items:center;gap:12px;padding:2px 4px 12px}
.gh b{flex:1;font-weight:600}
.gi{display:grid;place-items:center;width:40px;height:40px;border-radius:12px;font-weight:700;font-size:.85rem;background:var(--card)}
.gi.c500{color:var(--green)}.gi.c1000{color:var(--orange)}.gi.c2000{color:var(--blue)}
.chev{display:grid;place-items:center;width:32px;height:32px;border-radius:50%;background:var(--card);color:var(--mute)}
.gin{background:var(--card);border-radius:16px;padding:12px 14px}
.ga{display:flex;justify-content:space-between;font-variant-numeric:tabular-nums}
.ga b{font-weight:700}.ga span{color:var(--mute)}
.prog.c500 i{background:var(--green)}.prog.c1000 i{background:var(--orange)}.prog.c2000 i{background:var(--blue)}
.gf{display:flex;justify-content:space-between;font-size:.85rem;font-weight:500}
a.stat{display:block;text-decoration:none;color:inherit}
.dtop{display:grid;grid-template-columns:40px 1fr 40px;align-items:center;text-align:center;font-weight:600}
.dhead{display:flex;justify-content:space-between;align-items:flex-start}
.gi.big{width:56px;height:56px;border-radius:16px;font-size:1rem;box-shadow:var(--shadow)}
.badge{text-align:right}
.bt{display:inline-block;background:var(--okbg);color:var(--ok);font-weight:700;font-size:.85rem;border-radius:99px;padding:5px 12px}
.badge small{display:block;color:var(--mute);font-size:.75rem;margin-top:4px}
.dt{font-size:1.7rem;margin:0}
.chart{display:flex;align-items:stretch;justify-content:space-between;gap:10px;height:170px;padding-top:8px}
.cb{display:flex;flex-direction:column;flex:1;gap:8px;align-items:center}
.bw{flex:1;width:100%;display:flex;align-items:flex-end;justify-content:center}
.bw i{display:block;width:100%;max-width:34px;min-height:6px;background:#27272b;border-radius:99px}
.cb span{font-size:.75rem;color:var(--mute)}
.tx{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.tx:last-child{border:0}
.tx>div{flex:1;min-width:0}.tx b{display:block;font-weight:600}.tx small{color:var(--mute)}
.ti{display:grid;place-items:center;width:40px;height:40px;border-radius:50%;background:var(--okbg);color:var(--ok);font-weight:700}
.ta{font-weight:700;font-variant-numeric:tabular-nums}.ta.neg{color:var(--late)}
.fab{position:fixed;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:30;height:56px;max-width:560px;margin:0 auto;border-radius:20px;border:0;background:linear-gradient(#2c2c2e,#111);color:#fff;font:600 1rem inherit;font-family:inherit;box-shadow:0 12px 28px rgba(0,0,0,.35);cursor:pointer}
.total{grid-column:1/-1;margin:0;display:flex;align-items:center;justify-content:center;gap:6px;height:46px;padding:0 14px;text-align:center;border-radius:12px;background:var(--tint);color:var(--mute)}
.total b{color:var(--ink);font-size:1.2rem;font-weight:800}
.srow{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;align-items:end}
.res{display:grid;gap:8px;margin-top:8px}
.rs{display:flex;align-items:center;gap:12px;text-align:left;width:100%;min-height:56px;background:var(--tint);border:0;border-radius:14px;padding:10px 12px;font:inherit;color:inherit;cursor:pointer}
.rs b{display:block;font-weight:600}.rs small{color:var(--mute)}
.avatar.sm{display:grid;place-items:center;flex:0 0 auto;width:40px;height:40px;border-radius:50%;color:#fff;font-weight:800;font-size:.9rem;box-shadow:none}
input[type=search]{-webkit-appearance:none;appearance:none}
form input,form select{width:100%;height:46px}
.chk{display:flex;align-items:center;gap:14px;padding:14px;border-radius:14px;background:var(--tint);cursor:pointer;min-height:56px}
.chk input{width:24px;height:24px;min-width:24px;padding:0;border:0;background:none;accent-color:var(--ind);flex:0 0 auto;cursor:pointer}
.chk b{display:block;font-weight:600}.chk small{color:var(--mute)}
.chk.sel{background:var(--card);box-shadow:inset 0 0 0 2px var(--ind)}
.bar2{background:var(--card);border-radius:22px;padding:18px 16px;box-shadow:var(--shadow);display:grid;gap:12px;justify-items:center;text-align:center}
.bar2 .avatar.big{display:grid;place-items:center;width:84px;height:84px;border-radius:50%;color:#fff;font-weight:800;font-size:1.6rem;box-shadow:0 0 0 5px var(--tint)}
.bar2 .bn{font-size:1.2rem;font-weight:800;letter-spacing:-.02em}
.bar2 .sel2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;width:100%;text-align:left}
.bar2 .st2{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;width:100%}
.gi.c1500{color:#0e9aa7}.prog.c1500 i{background:#0e9aa7}
.gi.c2500{color:#7a3fa0}.prog.c2500 i{background:#7a3fa0}
.gi.c3000{color:#d6336c}.prog.c3000 i{background:#d6336c}
.gi.c5000{color:#b7791f}.prog.c5000 i{background:#b7791f}
.gi.c10000{color:#c8452f}.prog.c10000 i{background:#c8452f}
.lb{display:block;font-size:.85rem;font-weight:600;color:var(--mute);margin-bottom:5px}
.dd summary{list-style:none;display:flex;align-items:center;justify-content:space-between;gap:10px;height:46px;padding:0 14px;border:2px solid var(--line);border-radius:12px;background:var(--card);cursor:pointer}
.dd summary::-webkit-details-marker{display:none}
.dd summary span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dd summary::after{content:"";flex:0 0 auto;width:9px;height:9px;border-right:2px solid var(--ink);border-bottom:2px solid var(--ink);transform:rotate(45deg);margin-top:-4px}
.dd[open] summary::after{transform:rotate(-135deg);margin-top:4px}
.dd summary:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.dd .cards{margin-top:8px;max-height:340px;overflow:auto}
body.suivi nav,body.suivi #gear{display:none}
a.btn{display:inline-block;text-decoration:none;text-align:center}
.lk{display:flex;flex-wrap:wrap;gap:8px}
.gi.a500{color:var(--green)}.prog.a500 i{background:var(--green)}
.gi.a1000{color:var(--orange)}.prog.a1000 i{background:var(--orange)}
.gi.a1500{color:#0e9aa7}.prog.a1500 i{background:#0e9aa7}
.gi.a2000{color:var(--blue)}.prog.a2000 i{background:var(--blue)}
.gi.a2500{color:#7a3fa0}.prog.a2500 i{background:#7a3fa0}
.gi.a3000{color:#d6336c}.prog.a3000 i{background:#d6336c}
.gi.a5000{color:#b7791f}.prog.a5000 i{background:#b7791f}
.gi.a10000{color:#c8452f}.prog.a10000 i{background:#c8452f}
.fs{grid-column:1/-1;border:0;padding:0;margin:0;min-width:0}
.fs legend{font-size:.85rem;font-weight:600;color:var(--mute);padding:0;margin-bottom:6px}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.gt{font-size:.8rem;font-weight:700;color:var(--mute);margin:8px 2px 0}
.grid>*,.row>*,form>*{min-width:0}
@media (prefers-reduced-motion:no-preference){.day{transition:transform .12s}.day:hover{transform:translateY(-2px)}}
@media (max-width:640px){
 body{font-size:15px}
 header{padding:16px 16px 4px}
 h1{font-size:1.3rem}
 nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:30;padding:8px 16px;gap:30px;box-shadow:0 12px 30px rgba(0,0,0,.35)}
 nav button{width:52px;height:52px;padding:0;display:grid;place-items:center;position:relative}
 nav button svg{display:block;width:24px;height:24px}
 nav button span{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
 body.detail nav{display:none}
 main{padding:16px 12px 104px;gap:14px}
 .panel{padding:16px;border-radius:16px}
 .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
 .stat{padding:11px 12px}
 .stat b{font-size:1.1rem}
 .cal{grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
 .day{min-height:70px;padding:6px 7px}
 .row{flex-direction:column;align-items:stretch}
 .row>.btn,.row>span>.btn{width:100%;margin-top:4px}
 .btn,.step button{min-height:44px}
 form{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
 form .btn{width:100%;grid-column:1/-1}
 input,select{font-size:16px;padding:10px}
 .wrap{overflow:visible}
 table,tbody,tr,td{display:block;width:100%}
 thead{display:none}
 tr{padding:10px 0;border-bottom:1px solid var(--line)}
 tbody tr:last-child{border-bottom:0}
 td{display:flex;justify-content:space-between;gap:12px;border:0;padding:3px 0;text-align:right}
 td[data-label]::before{content:attr(data-label);color:var(--mute);font-size:.8rem;text-align:left}
 td.n{text-align:right}
 .legend{font-size:.78rem}
 body.suivi main{padding-bottom:32px}
 .kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
 .kpi{padding:12px}
 .kpi b{font-size:1.2rem}
 .kpi.main b{font-size:1.7rem}
 .pfa{display:flex;align-items:center;gap:14px}
 .pfi{display:none}
 .avatar{flex:0 0 auto;width:64px;height:64px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:1.3rem;box-shadow:0 0 0 4px var(--tint)}
 .pfa b{display:block;font-size:1.15rem;font-weight:800;letter-spacing:-.02em;line-height:1.25}
 .pfa small{display:block;color:var(--mute);font-size:.85rem}
 .csel{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
 .csel .btn{flex:0 0 auto}
 .cpick{flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px}
 .cpick .btn{flex:0 0 auto}
 main>.seg{order:-4}
 .cp:not(.act){display:none}
 main>.sticky{order:-3}
 main>.top{order:-2}
 main>.coll{order:-1}
 .cards{grid-template-columns:1fr;gap:10px}
 .carte{justify-content:space-between;gap:12px;padding:14px;border:2px solid transparent;min-height:140px}
 .carte>span{display:block}
 .carte b{display:block;font-size:1.15rem;font-weight:800;letter-spacing:-.02em}
 .carte .btn{margin-top:0}
 .carte.sel{background:var(--card);border-color:var(--ind);box-shadow:0 0 0 4px color-mix(in srgb,var(--ind) 15%,transparent)}
 .bar{grid-template-columns:repeat(2,minmax(0,1fr))}.bar .opt{display:none}

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const $=s=>document.querySelector(s);
const nb=n=>new Intl.NumberFormat('fr-FR').format(n).replace(/[\u202f\u00a0]/g,'\u00a0');
const fmt=n=>nb(n)+'\u00a0FCFA';
const esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const TID={Koti:'tontine','Foyer':'adogbe'};
let TYPES=['Koti','Foyer'],CARDS=[];
const CN=id=>CARDS.find(c=>c.id===id);
const START=Date.UTC(2026,0,1);
const todayUTC=()=>{const n=new Date();return Date.UTC(n.getFullYear(),n.getMonth(),n.getDate())};
const dayOfISO=s=>{const[y,m,d]=String(s).slice(0,10).split('-').map(Number);return Math.round((Date.UTC(y,m-1,d)-START)/864e5)+1};
const isoOfDay=g=>new Date(START+(g-1)*864e5).toISOString().slice(0,10);
let TODAY=Math.round((todayUTC()-START)/864e5)+1;
const MODES=['Espèces','MTN Mobile Money','Moov Money','Celtiis Cash','Autre'];
const gname=g=>(g.prenom+' '+g.nom).trim();
const GM=()=>(S.mgrOn&&S.managers.find(g=>g.id===S.gg))||{id:'admin',nom:'',prenom:'Administrateur'};
const BYG=()=>S.mgrOn?gname(GM())+' (gestionnaire)':'Administrateur';
const normTel=t=>{let d=String(t).replace(/\D/g,'');if(d.length===13&&d.startsWith('229'))d=d.slice(3);return /^01\d{8}$/.test(d)?d.replace(/(\d{2})(?=\d)/g,'$1 ').trim():null};
const gn=id=>{if(id==='admin')return 'Administrateur';const g=S.managers.find(x=>x.id===id);return g?gname(g):'aucun'};
const dateOf=d=>new Date(START+(d-1)*864e5).toLocaleDateString('fr-FR',{day:'numeric',month:'short',timeZone:'UTC'});
const mkCards=t=>Object.fromEntries(CARDS.map(c=>[c.id,{s:1,v:[{from:1,t:t[c.id]||0}],stop:null}]));
const mkMember=(id,nom,prenom,tel,quartier,t,g,idn,types)=>({id,nom,prenom,tel,quartier,g,idn,types:types||['Koti'],cards:mkCards(t),draft:Object.fromEntries(CARDS.map(c=>[c.id,t[c.id]||0]))});
let S={role:'admin',msg:null,gm:null,gg:'admin',mgrOn:false,auth:'loading',managers:[],members:[],payments:[],requests:[],refunds:[],adv:[],seq:1,rid:1,audit:[]};
const SHOW_MGR_TOGGLE=false;
const linkOf=m=>location.href.split('#')[0]+'#suivi';
const waLink=m=>`https://wa.me/229${m.tel.replace(/\D/g,'')}?text=${encodeURIComponent(`Bonjour ${m.prenom}, pour suivre vos tontines, ouvrez ce lien : ${linkOf(m)}\nPuis saisissez votre identifiant : ${m.idn}`)}`;
const newId=()=>{let id;do{id='TN-'+String(Math.floor(1000+Math.random()*9000))}while(S.members.some(m=>m.idn===id));return id};
function route(){const hs=(typeof location!=='undefined'&&location.hash)||'';if(/^#suivi(-TN-\d{4,6})?$/.test(hs)){if(!(S.suivi&&S.suivi!=='ask'))S.suivi='ask'}else S.suivi=null;if(S.suivi&&S.suivi!=='ask')S.gm=S.suivi.id}
const SB_URL='https://wdnyjtavnqmoknygcqyo.supabase.co',SB_KEY='sb_publishable_OfmHMfgs4v7Mh1Zt6CLhog_wz4GTHlE';
const sb=supabase.createClient(SB_URL,SB_KEY);
const chk=r=>{if(r&&r.error)throw r.error;return r};
const ins=(t,rows)=>sb.from(t).insert(rows).then(chk);
const upd=(t,vals,col,val)=>sb.from(t).update(vals).eq(col,val).then(chk);
let Qp=Promise.resolve();
const dbw=fn=>{Qp=Qp.then(fn).catch(async e=>{console.error(e);setMsg('Enregistrement impossible : '+(e&&e.message?e.message:'erreur')+'. Les données ont été rechargées.');try{await loadAll()}catch(_){}render()})};
let TNAME={tontine:'Koti',adogbe:'Foyer'};
const curTours=(m,id)=>{const v=[...m.cards[id].v].reverse().find(x=>x.from<=TODAY);return v?v.t:0};
function applyCards(m,rows){rows.forEach(r=>{const cc=m.cards[r.card_id];if(!cc)return;const s0=dayOfISO(r.start_date);cc.s=s0;cc.mcid=r.id;cc.v=[{from:1,t:0},{from:s0,t:1}];if(r.removed_from)cc.v.push({from:dayOfISO(r.removed_from),t:0});cc.stop=r.stop_day==null?null:r.stop_day});m.draft=Object.fromEntries(CARDS.map(c=>[c.id,curTours(m,c.id)]))}
async function loadCatalog(){const[ty,cd]=await Promise.all([sb.from('card_types').select('*'),sb.from('cards').select('*')]);chk(ty);chk(cd);TNAME={tontine:'Koti',adogbe:'Foyer'};TYPES=['tontine','adogbe'].filter(i=>TNAME[i]).map(i=>TNAME[i]);CARDS=cd.data.filter(c=>c.active).sort((a,b)=>TYPES.indexOf(TNAME[a.type_id])-TYPES.indexOf(TNAME[b.type_id])||a.value-b.value).map(c=>({id:c.id,name:c.name,v:c.value,type:TNAME[c.type_id]}))}
async function loadAll(){TODAY=Math.round((todayUTC()-START)/864e5)+1;await loadCatalog();
 const q=t=>sb.from(t).select('*'),R=await Promise.all([q('members').order('created_at'),q('member_types'),q('member_cards').order('created_at'),q('payments').order('created_at'),q('advances').order('created_at'),q('refunds').order('created_at'),sb.from('audit_log').select('*').order('id',{ascending:false}).limit(50)]);
 R.forEach(chk);const[me,mt,mc,pa,ad,rf,au]=R.map(r=>r.data),mcCard=Object.fromEntries(mc.map(r=>[r.id,r.card_id]));
 S.members=me.map(r=>{const m=mkMember(r.id,r.nom,r.prenom,r.tel,r.quartier,{},'admin',r.idn,mt.filter(x=>x.member_id===r.id).map(x=>TNAME[x.type_id]));applyCards(m,mc.filter(x=>x.member_id===r.id));m.cycles=((mt.find(x=>x.member_id===r.id&&x.type_id==='tontine')||{}).cycles)||null;return m});
 S.payments=pa.map(p=>({id:p.id,rec:p.receipt_no,g:'admin',m:p.member_id,mc:p.member_card_id,card:mcCard[p.member_card_id],amount:p.amount,mode:p.mode,ref:p.mobile_money_id||'',status:p.status}));
 S.adv=ad.map(a=>({id:a.id,m:a.member_id,amount:a.amount,rec:a.recovered}));
 S.refunds=rf.map(r=>({id:r.id,member:r.member_id,card:mcCard[r.member_card_id],mc:r.member_card_id,amount:r.amount,kept:r.kept,paid:r.paid}));
 S.audit=au.map(a=>({who:a.who,txt:a.txt}));
 S.seq=pa.reduce((mx,p)=>{const x=String(p.receipt_no).match(/^REC-\d+-(\d+)$/);return x?Math.max(mx,parseInt(x[1],10)):mx},0)+1;
 if(!S.members.find(m=>m.id===S.gm))S.gm=S.members[0]?S.members[0].id:null}
async function enter(session){const role=session&&session.user&&session.user.app_metadata&&session.user.app_metadata.role;if(role!=='admin'){S.auth='denied';render();return}
 try{await loadAll();S.auth='ok'}catch(e){S.auth='error';S.autherr=e&&e.message}render()}
async function boot(){route();
 try{if(S.suivi){if(!CARDS.length)await loadCatalog();render();return}
  const{data}=await sb.auth.getSession();if(data&&data.session)await enter(data.session);else{S.auth='login';render()}}
 catch(e){S.auth='error';S.autherr=e&&e.message;render()}}
function viewAuth(){if(S.auth==='loading')return '<section class="panel"><p class="sub">Chargement…</p></section>';
 if(S.auth==='denied')return '<section class="panel"><h2>Accès réservé</h2><p class="sub">Ce compte n’a pas accès à l’administration.</p><button class="btn" data-act="logout">Se déconnecter</button></section>';
 if(S.auth==='error')return `<section class="panel"><h2>Connexion impossible</h2><p class="sub">${esc(S.autherr||'Erreur inconnue')}</p><button class="btn" data-act="logout">Réessayer</button></section>`;
 return `<section class="panel"><h2>Connexion administrateur</h2><p class="sub">Connectez-vous pour gérer les tontines.</p><form id="loginf"><label style="grid-column:1/-1">Nom d’utilisateur<input name="user" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="30">${fe('loginf','user')}</label><label style="grid-column:1/-1">Code<input name="password" type="password" autocomplete="current-password">${fe('loginf','password')}</label><button class="btn main" type="submit">Se connecter</button></form></section>`}
async function login(e){e.preventDefault();const f=new FormData(e.target),user=String(f.get('user')||'').trim().toLowerCase(),password=String(f.get('password')||'');
 if(!user){fail('loginf','user','Saisissez votre nom d’utilisateur.',{user});return render()}
 if(!password){fail('loginf','password','Saisissez votre code.',{user});return render()}
 const email=user.replace(/[^a-z0-9._-]/g,'')+'@carnet-tontine.app';
 const{data,error}=await sb.auth.signInWithPassword({email,password});
 if(error){fail('loginf','password','Nom d’utilisateur ou code incorrect.',{user});return render()}
 S.err=null;await enter(data.session)}
function fromTracking(d){const mb=d.membre,m=mkMember(mb.idn,mb.nom,mb.prenom,'',mb.quartier,{},null,mb.idn,(d.types||[]).map(t=>TNAME[t]||t));
 m.cycles=mb.cycles||null;applyCards(m,(d.cartes||[]).map(c=>({id:c.id,card_id:c.carte,start_date:c.debut,stop_day:c.arret_jour,removed_from:c.retiree_le})));
 const mcCard=Object.fromEntries((d.cartes||[]).map(c=>[c.id,c.carte]));
 S.payments=(d.paiements||[]).map(p=>({id:p.recu,rec:p.recu,m:mb.idn,mc:p.carte_membre,card:mcCard[p.carte_membre],amount:p.montant,mode:p.mode,ref:'',status:p.statut}));S.adv=[];S.refunds=[];return m}
const log=(who,txt)=>{S.audit.unshift({who,txt});if(S.auth==='ok'&&!S.suivi)dbw(()=>ins('audit_log',{who,txt}))};
const MB=()=>S.members.find(m=>m.id===S.gm);
const nm=m=>m.prenom+' '+m.nom;
const mname=id=>nm(S.members.find(m=>m.id===id));
const each=fn=>S.members.map(m=>{const o=S.gm;S.gm=m.id;try{return fn(m)}finally{S.gm=o}});
const sumAll=f=>each(f).reduce((a,b)=>a+b,0);
const cardAt=(id,d)=>[...MB().cards[id].v].reverse().find(x=>x.from<=d).t;
const dueOf=(id,d)=>{const c=MB().cards[id];return(c.stop!==null&&d>c.stop)?0:CN(id).v*cardAt(id,c.s+d-1)};
const tcOf=id=>TODAY-MB().cards[id].s+1;
const dueNow=id=>dueOf(id,tcOf(id));
const held=()=>CARDS.filter(c=>MB().cards[c.id].v.some(x=>x.t>0));
const poolOf=id=>S.payments.filter(p=>p.m===S.gm&&p.card===id).reduce((s,p)=>s+p.amount,0);
const pool=()=>S.payments.filter(p=>p.m===S.gm).reduce((s,p)=>s+p.amount,0);
const advTotal=()=>S.adv.reduce((s,a)=>s+a.amount,0);
const advMember=()=>S.adv.filter(a=>a.m===S.gm).reduce((s,a)=>s+a.amount-(a.rec||0),0);
function rows(id){let p=poolOf(id);const t0=tcOf(id);return Array.from({length:31},(_,i)=>{const d=i+1,due=dueOf(id,d),paid=p>=due?due:0;p-=paid;
 const st=due===0?'susp':paid>=due?'paid':d<t0?'late':d===t0?'due':'future';return{d,due,paid,st}})}
const sumRows=(id,f,max)=>{const lim=max===undefined?31:max-MB().cards[id].s+1;return rows(id).filter(r=>r.d<=lim).reduce((s,r)=>s+f(r),0)};
const owed=()=>held().reduce((s,c)=>s+sumRows(c.id,r=>r.due-r.paid,TODAY),0);
function validAmounts(id){let s=0;return rows(id).filter(r=>r.due>r.paid).map(r=>s+=r.due)}
const retBase=id=>dueNow(id)*((CN(id)&&CN(id).type==='Koti'&&MB().cycles)||1);
function stopCalc(id){const v=poolOf(id),ret=Math.min(retBase(id),v),ded=Math.min(advMember(),v-ret);return{v,ret,ded,refund:v-ret-ded}}

const setMsg=(t,ok)=>{const m={t,ok};S.msg=m;S.err=null;if(ok)setTimeout(()=>{if(S.msg===m){S.msg=null;render()}},12000)};
const fail=(form,field,text,vals)=>{S.err={form,field,text,vals};S.msg=null};
const fe=(form,name)=>S.err&&S.err.form===form&&S.err.field===name?`<small class="ferr" id="e-${form}-${name}">${esc(S.err.text)}</small>`:'';
const totHtml=(id,n)=>{const w=id?validAmounts(id):[];return !id?'Choisissez une carte':!w.length?'Cette carte est entièrement payée':!Number.isInteger(n)||n<1?'Saisissez le nombre de tours':n>w.length?`Il ne reste que ${w.length} tour${w.length>1?'s':''} à payer`:`Montant à collecter : <b>${fmt(w[n-1])}</b>`};
const cardBox=(t,k)=>`<details class="dd"><summary><span>Choisir les cartes ${t}</span></summary><div class="cards">${CARDS.filter(c=>c.type===t).map(c=>`<label class="chk"><input type="checkbox" name="card_${c.id}"><span><b>${c.name}</b><small>${fmt(c.v)} par jour</small></span></label>`).join('')||'<p class="empty">Aucune carte disponible.</p>'}</div></details>${fe('regf',k)}`;
const typeBlock=(t,nm0,k,extra)=>`<div class="tb"><label class="chk"><input type="checkbox" name="${nm0}"><span><b>${t}</b></span></label><div class="tbody"><span class="lb">Cartes ${t}</span>${cardBox(t,k)}${extra||''}</div></div>`;
const typesField=(form,sel)=>form==='regf'?`<fieldset class="fs"><legend>Type de tontine</legend><div class="tbs">${typeBlock('Koti','type_t','cards_t',`<label>Durée de la tontine (en mois)<select name="cycles"><option value="">Choisir</option>${CYCLES.map(n=>`<option value="${n}">${n} mois</option>`).join('')}</select>${fe('regf','cycles')}</label>`)}${typeBlock('Foyer','type_a','cards_a','')}</div>${fe('regf','type_t')}</fieldset>`:`<div class="opts" style="margin-bottom:12px">${TYPES.map(t=>`<label class="chk"><input type="checkbox" data-act="mtype" data-id="${t}" ${sel.includes(t)?'checked':''}><span><b>${t}</b></span></label>`).join('')}</div>`;

 const R=all.slice(31*(k-1)).map((x,i)=>{const d=i+1,st=x.due===0?'susp':x.paid>=x.due?'paid':d<t?'late':d===t?'due':'future';return{d,due:x.due,paid:x.paid,st}});
 return{k,mx,t,R,s:c.s,paid:R.reduce((a,r)=>a+r.paid,0),full:R.reduce((a,r)=>a+r.due,0),owed:R.filter(r=>r.d<=t).reduce((a,r)=>a+r.due-r.paid,0),left:Math.max(0,31-t),end:c.s+31*k-1}}

const inscrire=e=>personForm(e,'regf',(v,T,f)=>{const id=crypto.randomUUID();const idn=newId(),types=[...(f.get('type_t')?['Koti']:[]),...(f.get('type_a')?['Foyer']:[])],cyc0=f.get('type_t')?parseInt(f.get('cycles'),10):null,chosen=CARDS.filter(c=>types.includes(c.type)&&f.get('card_'+c.id)),mcs=[];const m=mkMember(id,v.nom,v.prenom,T,v.quartier,{},S.gg,idn,types);m.cycles=cyc0;chosen.forEach(c=>{const cc=m.cards[c.id];cc.s=TODAY;cc.v=[{from:1,t:0},{from:TODAY,t:1}];cc.stop=null;cc.mcid=crypto.randomUUID();m.draft[c.id]=1;mcs.push({id:cc.mcid,member_id:id,card_id:c.id,start_date:isoOfDay(TODAY)})});S.members.push(m);S.gm=id;dbw(async()=>{await ins('members',{id,idn,nom:v.nom,prenom:v.prenom,tel:T,quartier:v.quartier});await ins('member_types',types.map(t=>({member_id:id,type_id:TID[t],cycles:t==='Koti'?cyc0:null})));if(mcs.length)await ins('member_cards',mcs)});log(GM().prenom,`Membre inscrit : ${v.prenom} ${v.nom}, quartier ${v.quartier}.`);setMsg(`${v.prenom} ${v.nom} est inscrit (${types.join(' et ')}${cyc0?', '+cyc0+' mois':''}), identifiant ${idn}. Cartes : ${chosen.map(c=>c.name).join(', ')}. Son lien de suivi est dans « Liens de suivi ».`,true)});
const creerG=e=>personForm(e,'gestf',(v,T)=>{S.managers.push({id:'g'+(S.managers.length+1),nom:v.nom,prenom:v.prenom,tel:T,quartier:v.quartier});log('Admin',`Gestionnaire créé : ${v.prenom} ${v.nom}, quartier ${v.quartier}.`);setMsg(`${v.prenom} ${v.nom} est créé comme gestionnaire.`,true)});

function giveAdv(e){e.preventDefault();const f=new FormData(e.target),nraw=String(f.get('a')||'').trim(),a=/^\d+$/.test(nraw)?parseInt(nraw,10):NaN,room=pool()-advMember(),v={a:f.get('a')};
 if(!Number.isInteger(a)||a<=0)fail('advf','a','Saisissez un montant entier supérieur à 0.',v);
 else if(room<=0)fail('advf','a','Rien n’est disponible : le total versé par ce membre est déjà couvert par des avances.',v);
 else if(a>room)fail('advf','a',`L’avance dépasse le total versé par ce membre, moins les avances déjà accordées : ${fmt(room)} au plus.`,v);
 else{S.requests.push({id:S.rid++,type:'avance',status:'soumise',member:S.gm,amount:a,by:BYG(),detail:`${fmt(a)}, sur le total versé.`});log(GM().prenom,`Demande d’avance de ${fmt(a)} soumise pour ${nm(MB())}.`);if(S.mgrOn)setMsg('Demande d’avance envoyée à l’administrateur.',true);else if(decide(S.requests[S.requests.length-1],true))setMsg('Avance accordée.',true)}
 render()}

function pay(e){e.preventDefault();const f=new FormData(e.target),id=f.get('card'),nraw=String(f.get('tours')||'').trim(),n=/^\d+$/.test(nraw)?parseInt(nraw,10):NaN,mode=f.get('mode'),ref=String(f.get('ref')||'').trim(),v={card:id,tours:f.get('tours'),mode,ref:f.get('ref')},w=id?validAmounts(id):[],tt=k=>k+' tour'+(k>1?'s':'');
 if(!id)fail('payf','card','Aucune carte active pour ce membre : choisissez d’abord ses cartes.',v);
 else if(!Number.isInteger(n)||n<=0)fail('payf','tours','Saisissez un nombre de tours entier supérieur à 0.',v);
 else if(!w.length)fail('payf','tours','Cette carte est entièrement payée.',v);
 else if(n>w.length)fail('payf','tours',`Il ne reste que ${tt(w.length)} à payer sur cette carte.`,v);
 else if(mode!=='Espèces'&&!ref)fail('payf','ref','Indiquez le Mobile Money ID : les 5 derniers chiffres de la transaction.',v);
 else if(ref&&S.payments.some(p=>p.ref.toLowerCase()===ref.toLowerCase()))fail('payf','ref','Ce Mobile Money ID existe déjà : vérifiez le numéro pour éviter un double encaissement.',v);
 else{const a=w[n-1],rec='REC-'+new Date().getFullYear()+'-'+String(S.seq++).padStart(4,'0'),pid=crypto.randomUUID(),mc=MB().cards[id].mcid,mid=S.gm;S.payments.push({id:pid,rec,g:S.gg,m:mid,mc,card:id,amount:a,mode,ref,status:'confirmé'});dbw(()=>ins('payments',{id:pid,receipt_no:rec,member_id:mid,member_card_id:mc,amount:a,tours:n,mode,mobile_money_id:ref||null}));log(GM().prenom,`Collecte de ${fmt(a)} (${tt(n)}) de ${nm(MB())} sur la ${CN(id).name} (${mode}), reçu ${rec}.`);setMsg(`Paiement enregistré, reçu ${rec} : ${tt(n)}, ${fmt(a)}.`,true)}
 render()}

function decide(q,okk){const o=S.gm;S.gm=q.member;
  if(!okk){q.status='refusée';log('Admin',`Demande ${q.type} refusée.`)}
  else if(q.type==='avance'&&q.amount>pool()-advMember()){S.gm=o;setMsg('Validation impossible : l’avance dépasse le montant versé disponible.');return false}
  else{q.status='approuvée';
   if(q.type==='avance'){{const aid=crypto.randomUUID();S.adv.push({id:aid,m:q.member,amount:q.amount,rec:0});dbw(()=>ins('advances',{id:aid,member_id:q.member,amount:q.amount,granted_by:'Admin'}))}log('Admin',`Avance de ${fmt(q.amount)} validée pour ${nm(MB())}.`)}
   else if(q.type==='changement'){CARDS.forEach(c=>{const cc=MB().cards[c.id];if(q.sel[c.id]!==cardAt(c.id,TODAY)){if(q.sel[c.id]){cc.s=TODAY;cc.v=[{from:TODAY,t:1}];cc.stop=null;cc.mcid=crypto.randomUUID();const mcid=cc.mcid,mid=q.member,cid=c.id;dbw(()=>ins('member_cards',{id:mcid,member_id:mid,card_id:cid,start_date:isoOfDay(TODAY)}))}else{cc.v.push({from:TODAY+1,t:0});const mcid=cc.mcid;if(mcid)dbw(()=>upd('member_cards',{removed_from:isoOfDay(TODAY+1)},'id',mcid))}}});log('Admin',`Changement approuvé pour ${nm(MB())} : une carte ajoutée commence au jour 1.`)}
   else{const k=stopCalc(q.card);MB().cards[q.card].stop=tcOf(q.card);{let left=k.ded;S.adv.filter(a=>a.m===q.member).forEach(a=>{const t=Math.min(left,a.amount-(a.rec||0));a.rec=(a.rec||0)+t;left-=t})}S.refunds.push({id:S.rid++,member:q.member,card:q.card,amount:k.refund,kept:k.ret,paid:false});log('Admin',`Arrêt de la ${CN(q.card).name} approuvé pour ${nm(MB())} : retenue ${fmt(k.ret)}, remboursement ${fmt(k.refund)}.`)}}
  S.gm=o;return true}

document.addEventListener('click',e=>{
 const r=e.target.closest('[data-role]');if(r){S.role=r.dataset.role;S.cdet=null;S.mdet=null;S.msg=null;S.err=null;S.cf=null;return render()}
 const el=e.target.closest('[data-act]');if(!el)return;const act=el.dataset.act,id=el.dataset.id;
 if(act==='pickpc'){S.pc=id;document.querySelectorAll('.cpick').forEach(cp=>{cp.querySelector('input[name=card]').value=id;cp.querySelectorAll('button').forEach(b=>{const on=b.dataset.id===id;b.classList.toggle('main',on);b.setAttribute('aria-pressed',on)})});return}
 if(act==='tog'){const c=e.target;MB().draft[id]=(c&&c.type==='checkbox')?(c.checked?1:0):(MB().draft[id]?0:1)}
 if(act==='pickc')S.mc=id;
 if(act==='reqchange'){const d=MB().draft,ch=CARDS.filter(c=>d[c.id]!==cardAt(c.id,TODAY));S.requests.push({id:S.rid++,type:'changement',status:'soumise',member:S.gm,by:BYG(),sel:{...d},detail:`${ch.map(c=>c.name+' : '+(d[c.id]?'ajoutée, jour 1 aujourd’hui':'retirée dès demain')).join(', ')}.`});log(GM().prenom,`Changement de cartes soumis pour ${nm(MB())}.`);if(S.mgrOn)setMsg('Changement soumis à l’administrateur. Une carte ajoutée commencera au jour 1 à son approbation.',true);else{decide(S.requests[S.requests.length-1],true);setMsg('Changement appliqué. Une carte ajoutée commence au jour 1, aujourd’hui.',true)}}
 if(act==='reqstop'){const k=stopCalc(id);S.requests.push({id:S.rid++,type:'arrêt',card:id,member:S.gm,by:'le membre',status:'soumise',detail:`${CN(id).name} : versé ${fmt(k.v)}, retenue ${fmt(k.ret)}, avances déduites ${fmt(k.ded)}, remboursable ${fmt(k.refund)}.`});log(nm(MB()),`Demande d’arrêt de la ${CN(id).name} soumise.`);setMsg('Demande d’arrêt envoyée.',true)}
 if(act==='closemsg')S.msg=null;
 if(act==='logout'){sb.auth.signOut().then(()=>{S.auth='login';S.members=[];S.payments=[];S.gm=null;S.err=null;render()})}
 if(act==='aview'){S.aview=id;S.cdet=null}
 if(act==='cdet')S.cdet=id;
 if(act==='mopen'){S.mdet=id;S.mall=false}
 if(act==='mback'){S.mdet=null;S.mall=false}
 if(act==='meye')S.hide=!S.hide;
 if(act==='mall')S.mall=!S.mall;
 if(act==='cback')S.cdet=null;
 if(act==='copylink'){const m=S.members.find(x=>x.id===id),l=linkOf(m);log('Admin',`Lien de suivi copié pour ${nm(m)}.`);const done=()=>{setMsg(`Lien copié pour ${nm(m)}. N’oubliez pas de lui envoyer son identifiant ${m.idn}.`,true);render()},bad=()=>{setMsg(`Copiez ce lien et envoyez-le à ${nm(m)} avec son identifiant ${m.idn} : ${l}`);render()};try{navigator.clipboard.writeText(l).then(done,bad)}catch(e){bad()}}
 if(act==='sentwa'){log('Admin',`Lien de suivi envoyé par WhatsApp à ${nm(S.members.find(x=>x.id===id))}.`)}
 if(act==='askstop')S.cfs=true;
 if(act==='keepstop')S.cfs=false;
 if(act==='dostop'){const mid=(S.members.find(m=>m.id===S.sm)||S.members[0]).id,k=stopCard(mid,id);S.cfs=false;S.sc=null;setMsg(`Carte arrêtée. Un remboursement de ${fmt(k.refund)} est à payer.`,true)}
 if(act==='mtype'){const c=e.target,m=MB();if(c.checked){if(!m.types.includes(id)){m.types.push(id);const mid=m.id;dbw(()=>ins('member_types',{member_id:mid,type_id:TID[id]}))}}else{const busy=CARDS.some(k=>k.type===id&&m.cards[k.id].v.some(x=>x.t>0)&&m.cards[k.id].stop===null);if(m.types.length<=1)setMsg('Un membre doit avoir au moins un type de tontine.');else if(busy)setMsg(`Retirez d’abord les cartes ${id} actives de ce membre.`);else{m.types=m.types.filter(t=>t!==id);{const mid=m.id;dbw(()=>sb.from('member_types').delete().eq('member_id',mid).eq('type_id',TID[id]).then(chk))}CARDS.filter(k=>k.type===id).forEach(k=>{m.draft[k.id]=0})}}}
 if(act==='pickm'){S.gm=id;S.q='';S.err=null;S.cf=null}
 if(act==='gocoll'){S.aview='collecte';S.pc=id;S.cdet=null}
 if(act==='askrev')S.cf=id;
 if(act==='keep')S.cf=null;
 if(act==='rev'){S.cf=null;const p=S.payments.find(x=>x.id==id),o=S.gm;S.gm=p.m;let s=0;const np=poolOf(p.card)-p.amount,bad=np!==0&&!Array.from({length:31},(_,i)=>s+=dueOf(p.card,i+1)).includes(np);S.gm=o;
  if(bad){setMsg('Annulation impossible : le solde de la carte ne correspondrait plus à des jours entiers. Annulez d’abord les paiements plus récents.');return render()}
  p.status='annulé';const rid=crypto.randomUUID(),rrec='ANN-'+p.rec.slice(4)+'-'+rid.slice(0,4);S.payments.push({id:rid,rec:rrec,g:p.g,m:p.m,mc:p.mc,card:p.card,amount:-p.amount,mode:p.mode,ref:'',status:'confirmé'});dbw(async()=>{await upd('payments',{status:'annulé'},'id',p.id);await ins('payments',{id:rid,receipt_no:rrec,member_id:p.m,member_card_id:p.mc,amount:-p.amount,mode:p.mode,reverses_payment_id:p.id})});log(GM().prenom,`Annulation du reçu ${p.rec} par écriture inverse.`);setMsg('Paiement annulé par écriture inverse.',true)}
 if(act==='ok'||act==='no'){const q=S.requests.find(x=>x.id==id);if(decide(q,act==='ok'))setMsg('Décision enregistrée.',true)}
 if(act==='mgr'){S.mgrOn=!S.mgrOn;S.gg=S.mgrOn&&S.managers[0]?S.managers[0].id:'admin';log('Admin',S.mgrOn?'Gestionnaires activés.':'Gestionnaires désactivés.');setMsg(S.mgrOn?'Gestionnaires activés. Créez-en un ou choisissez-en un dans la barre.':'Gestionnaires désactivés. Vous gérez seul la plateforme.',true)}
 if(act==='payref'){S.refunds.find(x=>x.id==id).paid=true;dbw(()=>upd('refunds',{paid:true},'id',id));log('Admin','Remboursement payé.')}
 render();if(typeof window!=='undefined'&&window.scrollTo&&['cdet','cback','gocoll','aview','mopen','mback'].includes(act))window.scrollTo(0,0)});
function updTot(){const tot=document.querySelector('#tot'),f=document.querySelector('#payf');if(!tot||!f||!f.elements)return;tot.innerHTML=totHtml(f.elements.card.value,parseInt(f.elements.tours.value,10))}
document.addEventListener('input',e=>{const t=e.target;if(t&&t.name==='tours')updTot();if(t&&t.id==='q'){S.q=t.value;updRes()}});
document.addEventListener('change',e=>{const t=e.target;if(t&&t.name==='card'){S.pc=t.value;document.querySelectorAll('select[name=card]').forEach(x=>{x.value=S.pc});updTot()}});
document.addEventListener('toggle',e=>{if(e.target&&e.target.id==='dd')S.dd=e.target.open},true);
if(typeof window!=='undefined'&&window.addEventListener)window.addEventListener('hashchange',()=>{const p=S.suivi;route();if(p!==S.suivi)boot()});
boot();
</script>
